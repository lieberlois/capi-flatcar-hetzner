apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: flatcar-hetzner
  namespace: default
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: flatcar-control-plane-template
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: flatcar-hcloud-machinetemplate
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 900
        unhealthyNodeConditions:
        - type: Ready
          status: Unknown
          timeoutSeconds: 300
        - type: Ready
          status: "False"
          timeoutSeconds: 300
      remediation:
        triggerIf:
          unhealthyLessThanOrEqualTo: 33%
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: flatcar-cluster-template
  workers:
    machineDeployments:
    - class: hcloud-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: flatcar-worker-config-template
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
          kind: HCloudMachineTemplate
          name: flatcar-hcloud-machinetemplate
      healthCheck:
        checks:
          nodeStartupTimeoutSeconds: 600
          unhealthyNodeConditions:
          - type: Ready
            status: Unknown
            timeoutSeconds: 300
          - type: Ready
            status: "False"
            timeoutSeconds: 300
        remediation:
          triggerIf:
            unhealthyInRange: "[0-1]"
  variables:
  - name: region
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: fsn1
  - name: clusterEndpointHost
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  - name: clusterEndpointPort
    required: false
    schema:
      openAPIV3Schema:
        type: integer
        default: 443
  - name: hcloudSSHKeyName
    required: true
    schema:
      openAPIV3Schema:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
  - name: hcloudNetwork
    required: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          enabled:
            type: boolean
          cidrBlock:
            type: string
          subnetCidrBlock:
            type: string
          networkZone:
            type: string
  - name: hcloudControlPlaneMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx22
  - name: hcloudControlPlaneMachineImageName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: flatcar-stable-x86
  - name: hcloudWorkerMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx22
  - name: hcloudWorkerMachineImageName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: flatcar-stable-x86
  patches:
  # --- Infrastructure cluster: endpoint, region, LB, network, ssh keys --------
  - name: HetznerClusterTemplateGeneral
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: "/spec/template/spec/controlPlaneEndpoint/host"
        valueFrom:
          variable: clusterEndpointHost
      - op: replace
        path: "/spec/template/spec/controlPlaneEndpoint/port"
        valueFrom:
          variable: clusterEndpointPort
      - op: add
        path: "/spec/template/spec/sshKeys/hcloud"
        valueFrom:
          variable: hcloudSSHKeyName
      - op: add
        path: "/spec/template/spec/controlPlaneRegions"
        valueFrom:
          template: "[{{ .region | quote }}]"
      - op: add
        path: "/spec/template/spec/controlPlaneLoadBalancer/region"
        valueFrom:
          variable: region
  - name: HetznerClusterTemplateNetwork
    enabledIf: "{{ if .hcloudNetwork.enabled }}true{{end}}"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: "/spec/template/spec/hcloudNetwork"
        valueFrom:
          variable: hcloudNetwork
  # --- Machine infra: machine type + image ----------------------------------
  - name: HCloudMachineTemplateControlPlane
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: "/spec/template/spec/type"
        valueFrom:
          variable: hcloudControlPlaneMachineType
      - op: replace
        path: "/spec/template/spec/imageName"
        valueFrom:
          variable: hcloudControlPlaneMachineImageName
  - name: HCloudMachineTemplateWorker
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - hcloud-worker
      jsonPatches:
      - op: replace
        path: "/spec/template/spec/type"
        valueFrom:
          variable: hcloudWorkerMachineType
      - op: replace
        path: "/spec/template/spec/imageName"
        valueFrom:
          variable: hcloudWorkerMachineImageName
  # --- Kubernetes version -> Ignition sysext config (single source of truth) -
  - name: KubernetesVersionControlPlane
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: "/spec/template/spec/kubeadmConfigSpec/ignition/containerLinuxConfig/additionalConfig"
        valueFrom:
          template: |
            {{- $v := .builtin.controlPlane.version -}}
            {{- $minor := regexReplaceAll "\\.[0-9]+$" $v "" -}}
            {{- printf "storage:\n  links:\n  - path: /etc/extensions/kubernetes.raw\n    hard: false\n    target: /opt/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\n  files:\n  - path: /etc/sysupdate.kubernetes.d/kubernetes-%[2]s.conf\n    mode: 0644\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-%[2]s.conf\n  - path: /etc/sysupdate.d/noop.conf\n    mode: 0644\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/noop.conf\n  - path: /opt/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\nsystemd:\n  units:\n  - name: systemd-sysupdate.service\n    dropins:\n    - name: kubernetes.conf\n      contents: |\n        [Service]\n        ExecStartPre=/usr/bin/sh -c \"readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes\"\n        ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C kubernetes update\n        ExecStartPost=/usr/bin/sh -c \"readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes-new\"\n        ExecStartPost=/usr/bin/sh -c \"if ! cmp --silent /tmp/kubernetes /tmp/kubernetes-new; then touch /run/reboot-required; fi\"\n  - name: systemd-sysupdate.timer\n    enabled: false\n  - name: kubeadm.service\n    dropins:\n    - name: 10-flatcar.conf\n      contents: |\n        [Unit]\n        After=containerd.service\n" $v $minor | quote -}}
  - name: KubernetesVersionWorker
    definitions:
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - hcloud-worker
      jsonPatches:
      - op: replace
        path: "/spec/template/spec/ignition/containerLinuxConfig/additionalConfig"
        valueFrom:
          template: |
            {{- $v := .builtin.machineDeployment.version -}}
            {{- $minor := regexReplaceAll "\\.[0-9]+$" $v "" -}}
            {{- printf "storage:\n  links:\n  - path: /etc/extensions/kubernetes.raw\n    hard: false\n    target: /opt/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\n  files:\n  - path: /etc/sysupdate.kubernetes.d/kubernetes-%[2]s.conf\n    mode: 0644\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-%[2]s.conf\n  - path: /etc/sysupdate.d/noop.conf\n    mode: 0644\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/noop.conf\n  - path: /opt/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\n    contents:\n      remote:\n        url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-%[1]s-x86-64.raw\nsystemd:\n  units:\n  - name: systemd-sysupdate.service\n    dropins:\n    - name: kubernetes.conf\n      contents: |\n        [Service]\n        ExecStartPre=/usr/bin/sh -c \"readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes\"\n        ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C kubernetes update\n        ExecStartPost=/usr/bin/sh -c \"readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes-new\"\n        ExecStartPost=/usr/bin/sh -c \"if ! cmp --silent /tmp/kubernetes /tmp/kubernetes-new; then touch /run/reboot-required; fi\"\n  - name: systemd-sysupdate.timer\n    enabled: false\n  - name: kubeadm.service\n    dropins:\n    - name: 10-flatcar.conf\n      contents: |\n        [Unit]\n        After=containerd.service\n" $v $minor | quote -}}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: flatcar-cluster-template
  namespace: default
spec:
  template:
    spec:
      controlPlaneEndpoint:
        host: ""
        port: 443
      controlPlaneLoadBalancer:
        region: fsn1
      controlPlaneRegions: []
      hcloudNetwork:
        enabled: true
        cidrBlock: 10.0.0.0/16
        subnetCidrBlock: 10.0.0.0/24
        networkZone: eu-central
      hetznerSecretRef:
        name: hcloud
        key:
          hcloudToken: hcloud
          hetznerRobotUser: robot-user
          hetznerRobotPassword: robot-password
      sshKeys:
        hcloud: []
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: flatcar-hcloud-machinetemplate
  namespace: default
spec:
  template:
    spec:
      type: cpx22
      imageName: flatcar-stable-x86
      sshKeys:
      - name: hetzner-flatcar-key
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: flatcar-control-plane-template
  namespace: default
spec:
  template:
    spec:
      kubeadmConfigSpec:
        format: ignition
        users:
        - name: root
          sshAuthorizedKeys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgPVuRlet/qJl4KsKBI26n4l9oNp8nd/9hHXB07y27a capi-management-hetzner
        files:
        - content: |
            net.bridge.bridge-nf-call-iptables = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward = 1
            net.ipv4.conf.lxc*.rp_filter = 0
          owner: root:root
          path: /etc/sysctl.d/99-kubernetes.conf
          permissions: "0644"
        ignition:
          containerLinuxConfig:
            additionalConfig: "{}"
        initConfiguration:
          skipPhases:
          - addon/kube-proxy
          nodeRegistration:
            criSocket: /run/containerd/containerd.sock
            kubeletExtraArgs:
            - name: cloud-provider
              value: external
        joinConfiguration:
          skipPhases:
          - addon/kube-proxy
          nodeRegistration:
            criSocket: /run/containerd/containerd.sock
            kubeletExtraArgs:
            - name: cloud-provider
              value: external
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: flatcar-worker-config-template
  namespace: default
spec:
  template:
    spec:
      format: ignition
      users:
      - name: root
        sshAuthorizedKeys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgPVuRlet/qJl4KsKBI26n4l9oNp8nd/9hHXB07y27a capi-management-hetzner
      files:
      - content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          net.ipv4.conf.lxc*.rp_filter = 0
        owner: root:root
        path: /etc/sysctl.d/99-kubernetes.conf
        permissions: "0644"
      ignition:
        containerLinuxConfig:
          additionalConfig: "{}"
      joinConfiguration:
        skipPhases:
        - addon/kube-proxy
        nodeRegistration:
          criSocket: /run/containerd/containerd.sock
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
