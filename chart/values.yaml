# Shared defaults. The Hetzner token Secret must exist in EACH cluster namespace
# (see scripts/04-create-secret.sh); the SSH key is a Hetzner-project-level object.
hetznerSecretName: hcloud
hetznerSecretKey: hcloud
sshAuthorizedKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgPVuRlet/qJl4KsKBI26n4l9oNp8nd/9hHXB07y27a capi-management-hetzner"

# One entry per cluster. The map key is the cluster name.
# Each cluster has its own namespace, and its own Kubernetes version per role.
#
# Version resolution per role: <role>.kubernetesVersion, falling back to the
# cluster's kubernetesVersion. The value is templated into spec.version AND the
# Ignition sysext URLs for that role.
clusters:
  hetzner-cluster:
    namespace: default
    region: fsn1
    sshKeyName: hetzner-flatcar-key
    addons: true # label addons=enabled -> Sveltos installs Cilium + hcloud-CCM
    podsCidr: 10.244.0.0/16
    servicesCidr: 10.245.0.0/16
    network:
      enabled: true
      cidrBlock: 10.0.0.0/16
      subnetCidrBlock: 10.0.0.0/24
    # Optional cluster-wide default; can be overridden per role below.
    kubernetesVersion: v1.36.4
    controlPlane:
      kubernetesVersion: v1.36.4
      replicas: 1
      machineType: cpx22
      imageName: flatcar-stable-x86
    workers:
      kubernetesVersion: v1.36.4
      replicas: 1
      failureDomain: fsn1
      machineType: cpx22
      imageName: flatcar-stable-x86
