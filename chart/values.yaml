# Single source of truth for the Kubernetes version.
# It is templated into the control plane, the workers AND the Ignition sysext URLs.
kubernetesVersion: v1.36.4

# Namespace for the CAPI objects.
namespace: default

# CAPH reads the Hetzner token from this Secret (created by scripts/04-create-secret.sh).
hetznerSecretName: hcloud
hetznerSecretKey: hcloud

# SSH public key injected into the Flatcar nodes via Ignition.
sshAuthorizedKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgPVuRlet/qJl4KsKBI26n4l9oNp8nd/9hHXB07y27a capi-management-hetzner"

# One entry per cluster. The map key is the cluster name.
# Add another entry to stamp another cluster.
clusters:
  hetzner-cluster:
    region: fsn1
    sshKeyName: hetzner-flatcar-key
    addons: true # label addons=enabled -> Sveltos installs Cilium + hcloud-CCM
    podsCidr: 10.244.0.0/16
    servicesCidr: 10.245.0.0/16
    network:
      enabled: true
      cidrBlock: 10.0.0.0/16
      subnetCidrBlock: 10.0.0.0/24
    controlPlane:
      replicas: 1
      machineType: cpx22
      imageName: flatcar-stable-x86
    workers:
      replicas: 1
      failureDomain: fsn1
      machineType: cpx22
      imageName: flatcar-stable-x86
