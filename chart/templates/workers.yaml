{{- range $name, $c := .Values.clusters }}
{{- $ns := $c.namespace | default "default" }}
{{- if $c.workers }}
{{- $v := $c.workers.kubernetesVersion | default $c.kubernetesVersion }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $name }}-worker
  namespace: {{ $ns }}
spec:
  template:
    spec:
      type: {{ $c.workers.machineType }}
      imageName: {{ $c.workers.imageName }}
      sshKeys:
      - name: {{ $c.sshKeyName }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: {{ $name }}-worker-config
  namespace: {{ $ns }}
spec:
  template:
    spec:
      format: ignition
      users:
      - name: root
        sshAuthorizedKeys:
        - {{ $.Values.sshAuthorizedKey | quote }}
      ignition:
        containerLinuxConfig:
          additionalConfig: |
            storage:
              links:
              - path: /etc/extensions/kubernetes.raw
                hard: false
                target: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
              files:
              - path: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
                contents:
                  remote:
                    url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
            systemd:
              units:
              # Reprovision-only update strategy (see control-plane.yaml).
              - name: update-engine.service
                mask: true
              - name: locksmithd.service
                mask: true
              - name: kubeadm.service
                dropins:
                - name: 10-flatcar.conf
                  contents: |
                    [Unit]
                    After=containerd.service
      joinConfiguration:
        skipPhases:
        - addon/kube-proxy
        nodeRegistration:
          criSocket: /run/containerd/containerd.sock
          ignorePreflightErrors:
          - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $name }}-worker
  namespace: {{ $ns }}
spec:
  clusterName: {{ $name }}
  replicas: {{ $c.workers.replicas }}
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        nodepool: worker
    spec:
      clusterName: {{ $name }}
      version: {{ $v }}
      failureDomain: {{ $c.workers.failureDomain }}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $name }}-worker-config
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
        name: {{ $name }}-worker
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ $name }}-worker-mhc
  namespace: {{ $ns }}
spec:
  clusterName: {{ $name }}
  selector:
    matchLabels:
      nodepool: worker
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 300s
  - type: Ready
    status: "False"
    timeout: 300s
  maxUnhealthy: 100%
  nodeStartupTimeout: 20m
{{- end }}
{{- end }}
