{{- range $name, $c := .Values.clusters }}
{{- $ns := $c.namespace | default "default" }}
{{- $v := $c.controlPlane.kubernetesVersion | default $c.kubernetesVersion }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $name }}-control-plane
  namespace: {{ $ns }}
spec:
  template:
    spec:
      type: {{ $c.controlPlane.machineType }}
      imageName: {{ $c.controlPlane.imageName }}
      sshKeys:
      - name: {{ $c.sshKeyName }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: {{ $name }}-control-plane
  namespace: {{ $ns }}
spec:
  replicas: {{ $c.controlPlane.replicas }}
  version: {{ $v }}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
        name: {{ $name }}-control-plane
  kubeadmConfigSpec:
    format: ignition
    users:
    - name: root
      sshAuthorizedKeys:
      - {{ $.Values.sshAuthorizedKey | quote }}
    ignition:
      containerLinuxConfig:
        additionalConfig: |
          storage:
            links:
            - path: /etc/extensions/kubernetes.raw
              hard: false
              target: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
            files:
            - path: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
              contents:
                remote:
                  url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
          systemd:
            units:
            # Reprovision-only update strategy: disable Flatcar's self-update and
            # reboot machinery. OS + Kubernetes updates are rolled by CAPI (new
            # nodes), not applied in place.
            - name: update-engine.service
              mask: true
            - name: locksmithd.service
              mask: true
            - name: kubeadm.service
              dropins:
              - name: 10-flatcar.conf
                contents: |
                  [Unit]
                  After=containerd.service
    initConfiguration:
      skipPhases:
      - addon/kube-proxy
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
        {{- if $c.controlPlane.allowScheduling }}
        taints: []
        {{- end }}
        ignorePreflightErrors:
        - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
    joinConfiguration:
      skipPhases:
      - addon/kube-proxy
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
        {{- if $c.controlPlane.allowScheduling }}
        taints: []
        {{- end }}
        ignorePreflightErrors:
        - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
{{- end }}
