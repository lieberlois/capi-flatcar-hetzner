{{- range $name, $c := .Values.clusters }}
{{- $ns := $c.namespace | default "default" }}
{{- $v := $c.controlPlane.kubernetesVersion | default $c.kubernetesVersion }}
{{- $minor := regexReplaceAll "\\.[0-9]+$" $v "" }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ $name }}-control-plane
  namespace: {{ $ns }}
spec:
  template:
    spec:
      type: {{ $c.controlPlane.machineType }}
      imageName: {{ $c.controlPlane.imageName }}
      sshKeys:
      - name: {{ $c.sshKeyName }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: {{ $name }}-control-plane
  namespace: {{ $ns }}
spec:
  replicas: {{ $c.controlPlane.replicas }}
  version: {{ $v }}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
        name: {{ $name }}-control-plane
  kubeadmConfigSpec:
    format: ignition
    users:
    - name: root
      sshAuthorizedKeys:
      - {{ $.Values.sshAuthorizedKey | quote }}
    ignition:
      containerLinuxConfig:
        additionalConfig: |
          storage:
            links:
            - path: /etc/extensions/kubernetes.raw
              hard: false
              target: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
            files:
            - path: /etc/sysupdate.kubernetes.d/kubernetes-{{ $minor }}.conf
              mode: 0644
              contents:
                remote:
                  url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-{{ $minor }}.conf
            - path: /etc/sysupdate.d/noop.conf
              mode: 0644
              contents:
                remote:
                  url: https://extensions.flatcar.org/extensions/noop.conf
            - path: /opt/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
              contents:
                remote:
                  url: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-{{ $v }}-x86-64.raw
          systemd:
            units:
            - name: systemd-sysupdate.service
              dropins:
              - name: kubernetes.conf
                contents: |
                  [Service]
                  ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes"
                  ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C kubernetes update
                  ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes-new"
                  ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/kubernetes /tmp/kubernetes-new; then touch /run/reboot-required; fi"
            - name: systemd-sysupdate.timer
              enabled: false
            - name: kubeadm.service
              dropins:
              - name: 10-flatcar.conf
                contents: |
                  [Unit]
                  After=containerd.service
    initConfiguration:
      skipPhases:
      - addon/kube-proxy
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
        ignorePreflightErrors:
        - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
    joinConfiguration:
      skipPhases:
      - addon/kube-proxy
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
        ignorePreflightErrors:
        - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
{{- end }}
