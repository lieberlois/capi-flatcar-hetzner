apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: hcloud-ccm
spec:
  clusterSelector:
    matchLabels:
      addons: enabled
  # NOTE: no dependsOn. Ordering on Cilium caused a Sveltos delete/recreate
  # deadlock ("still depends on this profile"); the CCM is fine to deploy in
  # parallel and simply waits for the CNI before its pod can start.
  syncMode: Continuous
  # Distributes the hcloud credentials Secret (rendered into the ConfigMap
  # "hcloud-ccm-addon" by scripts/08-apply-addons.sh; token never in git).
  policyRefs:
  - kind: ConfigMap
    name: hcloud-ccm-addon
    namespace: default
  helmCharts:
  - repositoryURL: https://charts.hetzner.cloud
    repositoryName: hcloud
    chartName: hcloud-cloud-controller-manager
    chartVersion: 1.38.0
    releaseName: hccm
    releaseNamespace: kube-system
    helmChartAction: Install
