apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: cilium
spec:
  # Matches any CAPI Cluster carrying this label (see chart/values.yaml).
  clusterSelector:
    matchLabels:
      addons: enabled
  syncMode: Continuous
  helmCharts:
  - repositoryURL: https://helm.cilium.io/
    repositoryName: cilium
    chartName: cilium/cilium
    chartVersion: 1.20.2
    releaseName: cilium
    releaseNamespace: kube-system
    helmChartAction: Install
    values: |
      ipam:
        mode: kubernetes
      # With --cloud-provider=external the Node has no address until the CCM
      # runs (and the CCM needs the CNI) -> Cilium cannot auto-detect a device.
      # Pin it to eth0: that NIC holds the default route, so pod egress (and the
      # CCM's Hetzner API calls) actually reach the internet.
      devices:
      - eth0
      directRoutingDevice: eth0
      # Replace kube-proxy entirely (kubeadm skips the addon/kube-proxy phase).
      kubeProxyReplacement: true
      # Cilium needs the API endpoint before kube-proxy exists; take it from CAPI.
      k8sServiceHost: "{{ .Cluster.spec.controlPlaneEndpoint.host }}"
      k8sServicePort: "{{ .Cluster.spec.controlPlaneEndpoint.port }}"
      bpf:
        masquerade: true
      # Single/small clusters: the default operator replicas=2 leaves a Pending
      # replica (host ports) on a one-node cluster.
      operator:
        replicas: 1
