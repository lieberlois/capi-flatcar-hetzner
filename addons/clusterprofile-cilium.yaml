apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: cilium
spec:
  # Matches any CAPI Cluster carrying this label (see chart/values.yaml).
  clusterSelector:
    matchLabels:
      addons: enabled
  syncMode: Continuous
  helmCharts:
  - repositoryURL: https://helm.cilium.io/
    repositoryName: cilium
    chartName: cilium/cilium
    chartVersion: 1.20.2
    releaseName: cilium
    releaseNamespace: kube-system
    helmChartAction: Install
    values: |
      ipam:
        mode: kubernetes
      # Cilium is the CNI only; kube-proxy handles service load-balancing.
      # This avoids kube-proxy replacement's k8sServiceHost requirement and the
      # device auto-detection problems on --cloud-provider=external nodes.
      kubeProxyReplacement: false
      # Single/small clusters: the default operator replicas=2 leaves a Pending
      # replica (host ports) on a one-node cluster.
      operator:
        replicas: 1
