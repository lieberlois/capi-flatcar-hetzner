apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: hetzner-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.36.3
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HCloudMachineTemplate
        name: flatcar-control-plane
  kubeadmConfigSpec:
    format: ignition
    users:
    - name: root
      sshAuthorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgPVuRlet/qJl4KsKBI26n4l9oNp8nd/9hHXB07y27a capi-management-hetzner
    files:
    - content: |
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
        net.ipv4.conf.lxc*.rp_filter = 0
      owner: root:root
      path: /etc/sysctl.d/99-kubernetes.conf
      permissions: "0644"
    - content: |
        nameserver 1.1.1.1
        nameserver 1.0.0.1
      owner: root:root
      path: /etc/kubernetes/resolv.conf
      permissions: "0644"
    - content: |
        [Unit]
        Description=kubelet: The Kubernetes Node Agent
        Documentation=https://kubernetes.io/docs/home/
        Wants=network-online.target
        After=network-online.target

        [Service]
        ExecStart=/opt/bin/kubelet
        Restart=always
        StartLimitInterval=0
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
      owner: root:root
      path: /etc/systemd/system/kubelet.service
      permissions: "0644"
    - content: |
        [Service]
        Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
        Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
        Environment="KUBELET_EXTRA_ARGS=--cloud-provider=external --container-runtime-endpoint=unix:///run/containerd/containerd.sock --resolv-conf=/etc/kubernetes/resolv.conf"
        ExecStart=
        ExecStart=/opt/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_EXTRA_ARGS
      owner: root:root
      path: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
      permissions: "0644"
    initConfiguration:
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
    joinConfiguration:
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
    preKubeadmCommands:
    - export PATH=$PATH:/opt/bin
    - systemctl enable --now containerd
    - kubeadm config images pull