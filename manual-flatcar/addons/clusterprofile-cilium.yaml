apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: cilium
spec:
  # Matches any CAPI Cluster carrying this label (see manual-flatcar/manifests/cluster.yaml).
  clusterSelector:
    matchLabels:
      addons: enabled
  syncMode: Continuous
  helmCharts:
  - repositoryURL: https://helm.cilium.io/
    repositoryName: cilium
    chartName: cilium/cilium
    chartVersion: 1.20.2
    releaseName: cilium
    releaseNamespace: kube-system
    helmChartAction: Install
    values: |
      ipam:
        mode: kubernetes
      # Replace kube-proxy entirely (kubeadm skips the addon/kube-proxy phase).
      kubeProxyReplacement: true
      # Cilium needs the API endpoint before kube-proxy exists; take it from CAPI.
      k8sServiceHost: "{{ .Cluster.spec.controlPlaneEndpoint.host }}"
      k8sServicePort: "{{ .Cluster.spec.controlPlaneEndpoint.port }}"
      bpf:
        masquerade: true
